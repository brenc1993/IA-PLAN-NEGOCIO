<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency OS — Final Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #0d0d0d; --accent: #e8c97a; --text: #f0ede8; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #151515; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        input, textarea, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; }
        input, textarea, select { background: #1c1c1c; color: white; }
        button { background: var(--accent); color: black; font-weight: bold; cursor: pointer; border: none; }
        button:disabled { opacity: 0.5; }
        #result { display: none; background: white; color: black; padding: 30px; border-radius: 8px; margin-top: 20px; }
        .error-msg { color: #ff6b6b; padding: 10px; background: rgba(255,107,107,0.1); border-radius: 8px; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Agency Strategic Planner</h2>
    <div id="errorBox" class="error-msg"></div>
    
    <div class="card">
        <label>API Key de Gemini</label>
        <input type="password" id="apiKey" placeholder="Pega aquí tu AIzaSy...">
        
        <label>Descripción del Negocio</label>
        <textarea id="desc" rows="5" placeholder="Tu idea de agencia..."></textarea>
        
        <button id="genBtn" onclick="generate()">GENERAR ESTRATEGIA</button>
    </div>

    <button id="pdfBtn" style="display:none; background: #333; color: white;" onclick="downloadPDF()">Descargar PDF</button>

    <div id="result">
        <div id="pdfContent"></div>
    </div>
</div>

<script>
    async function generate() {
        const key = document.getElementById('apiKey').value.trim();
        const desc = document.getElementById('desc').value.trim();
        const errorBox = document.getElementById('errorBox');
        const genBtn = document.getElementById('genBtn');

        if(!key || !desc) { alert("Faltan datos"); return; }

        errorBox.style.display = 'none';
        genBtn.disabled = true;
        genBtn.innerText = "Procesando...";

        const prompt = `Analiza este negocio: "${desc}". Genera un plan con frameworks de Hormozi y Sinek. 
        Devuelve SOLO un JSON con esta estructura: {"titulo": "nombre", "plan": "contenido en HTML"}`;

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { response_mime_type: "application/json" }
                })
            });

            const data = await resp.json();

            // Validación de seguridad para la respuesta
            if (data.error) {
                throw new Error(data.error.message || "Error en la API Key");
            }

            if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                throw new Error("Gemini no pudo generar una respuesta. Revisa tu descripción.");
            }

            const rawText = data.candidates[0].content.parts[0].text;
            const cleanJson = JSON.parse(rawText);

            document.getElementById('pdfContent').innerHTML = `<h1>${cleanJson.titulo}</h1><div>${cleanJson.plan}</div>`;
            document.getElementById('result').style.display = 'block';
            document.getElementById('pdfBtn').style.display = 'block';

        } catch (e) {
            errorBox.innerText = "Error: " + e.message;
            errorBox.style.display = 'block';
            console.error(e);
        } finally {
            genBtn.disabled = false;
            genBtn.innerText = "GENERAR ESTRATEGIA";
        }
    }

    function downloadPDF() {
        const element = document.getElementById('pdfContent');
        html2pdf().from(element).save('estrategia-agencia.pdf');
    }
</script>
</body>
</html>

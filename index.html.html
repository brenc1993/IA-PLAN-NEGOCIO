<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Strategic OS — Business Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --bg2: #121212; --bg3: #1a1a1a;
            --accent: #e8c97a; --text: #f0ede8; --text2: #a09c97;
            --border: rgba(255,255,255,0.06); --radius: 12px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 2.5rem; color: var(--accent); margin: 0; }
        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; margin-bottom: 20px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
        input, textarea, select { 
            width: 100%; background: var(--bg3); border: 1px solid var(--border); padding: 12px; 
            border-radius: 8px; color: white; margin-bottom: 15px; font-family: inherit; box-sizing: border-box;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stage-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .stage-btn { 
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); 
            background: var(--bg3); color: var(--text2); cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .stage-btn.active { background: var(--accent); color: black; font-weight: 700; border-color: var(--accent); }
        .btn-main { 
            width: 100%; background: var(--accent); color: black; border: none; padding: 18px; 
            font-size: 16px; font-family: 'Syne', sans-serif; font-weight: 700; border-radius: var(--radius); 
            cursor: pointer; transition: 0.2s;
        }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
        #pdfBtn { 
            background: #333; color: white; border: none; padding: 12px; border-radius: 8px; 
            cursor: pointer; margin-top: 20px; display: none; width: 100%; font-weight: bold;
        }
        .error-box { background: rgba(255, 107, 107, 0.1); color: #ff6b6b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; border: 1px solid rgba(255,107,107,0.2); }
        #result { display: none; margin-top: 40px; padding: 40px; background: white; color: #111; border-radius: 8px; }
        .loader { display: none; text-align: center; color: var(--accent); margin: 20px 0; font-weight: bold; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Agency OS<span>.</span></h1>
    <p style="color: var(--text2); margin-bottom: 30px;">Planificación estratégica avanzada para emprendedores y agencias.</p>

    <div id="errorDisplay" class="error-box"></div>

    <div class="card">
        <label>Google API Key (Gemini)</label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">

        <label>Descripción del Negocio / Visión</label>
        <textarea id="desc" rows="6" placeholder="¿Qué quieres lograr? Cuantos más detalles des sobre tus servicios y clientes, mejor será el plan."></textarea>

        <label>¿En qué etapa estás?</label>
        <div class="stage-group" id="stageGroup">
            <button class="stage-btn active" onclick="setStage(this, 'idea')">Idea</button>
            <button class="stage-btn" onclick="setStage(this, 'validado')">Validado</button>
            <button class="stage-btn" onclick="setStage(this, 'primeros clientes')">Primeros Clientes</button>
            <button class="stage-btn" onclick="setStage(this, 'creciendo')">Creciendo</button>
            <button class="stage-btn" onclick="setStage(this, 'escalar')">Escalar</button>
        </div>

        <div class="grid">
            <div>
                <label>Objetivo Principal</label>
                <select id="goal">
                    <option value="validar idea">Validar idea</option>
                    <option value="conseguir primeros clientes">Conseguir primeros clientes</option>
                    <option value="definir precios y monetizar">Definir precios y monetizar</option>
                    <option value="escalar y crecer">Escalar y crecer</option>
                    <option value="diferenciarme de la competencia">Diferenciarme de la competencia</option>
                    <option value="construir una marca sólida">Construir marca sólida</option>
                </select>
            </div>
            <div>
                <label>Presupuesto Mensual</label>
                <select id="budget">
                    <option value="orgánico (0 USD)">$0 (Orgánico)</option>
                    <option value="bajo (menos de 500 USD)">Bajo (< 500 USD)</option>
                    <option value="medio (500 - 2000 USD)">Medio (500 - 2000 USD)</option>
                    <option value="alto (más de 2000 USD)">Alto (> 2000 USD)</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Competencia (Opcional)</label>
                <input type="text" id="competition" placeholder="¿Contra quién compites?">
            </div>
            <div>
                <label>Mayor Obstáculo (Opcional)</label>
                <input type="text" id="obstacle" placeholder="¿Qué te detiene hoy?">
            </div>
        </div>
    </div>

    <button class="btn-main" id="genBtn" onclick="generatePlan()">GENERAR PLAN MAESTRO →</button>
    
    <div class="loader" id="loader">Conectando con las mentes expertas...</div>

    <button id="pdfBtn" onclick="downloadPDF()">↓ DESCARGAR ESTRATEGIA EN PDF</button>

    <div id="result">
        <div id="pdfContent">
            <h1 id="resumenTitulo" style="color: #000; border-bottom: 3px solid #e8c97a; padding-bottom: 10px; margin-bottom: 20px;"></h1>
            <div id="sectionsContainer"></div>
        </div>
    </div>
</div>

<script>
    let currentStage = 'idea';

    function setStage(btn, val) {
        document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStage = val;
    }

    async function generatePlan() {
        const key = document.getElementById('apiKey').value.trim();
        const desc = document.getElementById('desc').value.trim();
        const errorDisplay = document.getElementById('errorDisplay');
        const loader = document.getElementById('loader');
        const genBtn = document.getElementById('genBtn');

        if (!key || !desc) { alert("API Key y Descripción son obligatorias."); return; }

        errorDisplay.style.display = 'none';
        loader.style.display = 'block';
        genBtn.disabled = true;

        const prompt = `Actúa como un comité de consultores (Hormozi, Sinek, Drucker, Godin). 
        Analiza este negocio: "${desc}". 
        Etapa: ${currentStage}. Objetivo: ${document.getElementById('goal').value}. Presupuesto: ${document.getElementById('budget').value}.
        Competencia: ${document.getElementById('competition').value || 'No definida'}. 
        Obstáculo: ${document.getElementById('obstacle').value || 'No definido'}.

        Responde ÚNICAMENTE con un JSON puro con esta estructura:
        {
          "resumen": "Título del Plan",
          "bloques": [
            {"autor": "Simon Sinek", "tema": "El Porqué", "contenido": "HTML con <p>, <ul>, <strong>"},
            {"autor": "Alex Hormozi", "tema": "La Oferta Irresistible", "contenido": "HTML"},
            {"autor": "Seth Godin", "tema": "Posicionamiento", "contenido": "HTML"},
            {"autor": "Peter Drucker", "tema": "Métricas de CEO", "contenido": "HTML"},
            {"autor": "Hoja de Ruta", "tema": "Acción 30 días", "contenido": "HTML"}
          ]
        }`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { response_mime_type: "application/json" }
                })
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error.message || "Error de API");
            }

            if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                throw new Error("Respuesta incompleta de la IA. Intenta ser más descriptiva en tu texto.");
            }

            const rawText = data.candidates[0].content.parts[0].text;
            const plan = JSON.parse(rawText);
            
            renderPlan(plan);
        } catch (e) {
            errorDisplay.innerText = "Error: " + e.message;
            errorDisplay.style.display = 'block';
            console.error(e);
        } finally {
            loader.style.display = 'none';
            genBtn.disabled = false;
        }
    }

    function renderPlan(plan) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('pdfBtn').style.display = 'block';
        document.getElementById('resumenTitulo').innerText = plan.resumen;
        
        const container = document.getElementById('sectionsContainer');
        container.innerHTML = '';

        plan.bloques.forEach(b => {
            const div = document.createElement('div');
            div.style.marginBottom = '30px';
            div.innerHTML = `
                <div style="font-size: 12px; font-weight: bold; color: #666; text-transform: uppercase;">${b.autor}</div>
                <h2 style="margin: 5px 0 15px 0; font-family: 'Syne'; font-size: 20px;">${b.tema}</h2>
                <div style="font-size: 15px; color: #333; line-height: 1.6;">${b.contenido}</div>
            `;
            container.appendChild(div);
        });
        document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    function downloadPDF() {
        const element = document.getElementById('pdfContent');
        const opt = {
            margin: 0.5,
            filename: 'Estrategia-Negocio-IA.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>

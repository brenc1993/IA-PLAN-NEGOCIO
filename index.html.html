<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency OS — Business Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --bg2: #121212; --bg3: #1a1a1a;
            --accent: #e8c97a; --text: #f0ede8; --text2: #a09c97;
            --border: rgba(255,255,255,0.06); --radius: 12px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 2.5rem; color: var(--accent); margin: 0; }
        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; margin-bottom: 20px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
        input, textarea, select { 
            width: 100%; background: var(--bg3); border: 1px solid var(--border); padding: 12px; 
            border-radius: 8px; color: white; margin-bottom: 15px; font-family: inherit; box-sizing: border-box;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stage-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .stage-btn { 
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); 
            background: var(--bg3); color: var(--text2); cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .stage-btn.active { background: var(--accent); color: black; font-weight: 700; border-color: var(--accent); }
        .btn-main { 
            width: 100%; background: var(--accent); color: black; border: none; padding: 18px; 
            font-size: 16px; font-family: 'Syne', sans-serif; font-weight: 700; border-radius: var(--radius); 
            cursor: pointer; transition: 0.2s;
        }
        #pdfBtn { background: #333; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; margin-top: 20px; display: none; width: 100%; font-weight: bold; }
        .error-box { background: rgba(255, 107, 107, 0.1); color: #ff6b6b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; border: 1px solid rgba(255,107,107,0.2); }
        #result { display: none; margin-top: 40px; padding: 40px; background: white; color: #111; border-radius: 8px; }
        .loader { display: none; text-align: center; color: var(--accent); margin: 20px 0; font-weight: bold; }
        .section-item { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Agency OS<span>.</span></h1>
    <p style="color: var(--text2); margin-bottom: 30px;">Planificación estratégica profesional para tu agencia.</p>

    <div id="errorDisplay" class="error-box"></div>

    <div class="card">
        <label>Google API Key</label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">

        <label>Descripción del Negocio</label>
        <textarea id="desc" rows="6" placeholder="Describe tu idea, servicios y visión..."></textarea>

        <label>Etapa Actual</label>
        <div class="stage-group" id="stageGroup">
            <button class="stage-btn active" onclick="setStage(this, 'idea')">Idea</button>
            <button class="stage-btn" onclick="setStage(this, 'validado')">Validado</button>
            <button class="stage-btn" onclick="setStage(this, 'primeros clientes')">Primeros Clientes</button>
            <button class="stage-btn" onclick="setStage(this, 'creciendo')">Creciendo</button>
            <button class="stage-btn" onclick="setStage(this, 'escalar')">Escalar</button>
        </div>

        <div class="grid">
            <div>
                <label>Objetivo Principal</label>
                <select id="goal">
                    <option value="validar idea">Validar idea</option>
                    <option value="conseguir clientes">Conseguir clientes</option>
                    <option value="definir precios">Definir precios/monetización</option>
                    <option value="escalar">Escalar facturación</option>
                    <option value="marca">Marca Personal/Agencia</option>
                </select>
            </div>
            <div>
                <label>Presupuesto Mensual</label>
                <select id="budget">
                    <option value="orgánico">$0 (Orgánico)</option>
                    <option value="bajo">< 500 USD</option>
                    <option value="medio">500 - 2000 USD</option>
                    <option value="alto">> 2000 USD</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <input type="text" id="competition" placeholder="Competencia (opcional)">
            <input type="text" id="obstacle" placeholder="Mayor obstáculo (opcional)">
        </div>
    </div>

    <button class="btn-main" id="genBtn" onclick="generatePlan()">GENERAR ESTRATEGIA →</button>
    <div class="loader" id="loader">Analizando con frameworks de élite...</div>
    <button id="pdfBtn" onclick="downloadPDF()">↓ DESCARGAR PDF</button>

    <div id="result">
        <div id="pdfContent">
            <h1 id="resumenTitulo" style="color: black; border-bottom: 4px solid #e8c97a; padding-bottom: 10px;"></h1>
            <div id="sectionsContainer"></div>
        </div>
    </div>
</div>

<script>
    let currentStage = 'idea';
    function setStage(btn, val) {
        document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStage = val;
    }

    async function callGemini(key, prompt, modelName) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { response_mime_type: "application/json" }
            })
        });
        return response;
    }

    async function generatePlan() {
        const key = document.getElementById('apiKey').value.trim();
        const desc = document.getElementById('desc').value.trim();
        const errorDisplay = document.getElementById('errorDisplay');
        const loader = document.getElementById('loader');
        
        if (!key || !desc) { alert("Faltan datos"); return; }

        errorDisplay.style.display = 'none';
        loader.style.display = 'block';

        const prompt = `Analiza este negocio: "${desc}". Etapa: ${currentStage}. Objetivo: ${document.getElementById('goal').value}. Presupuesto: ${document.getElementById('budget').value}.
        Usa los frameworks de Hormozi (oferta), Sinek (por qué), Drucker (métricas) y Godin (nicho).
        Responde ÚNICAMENTE un JSON: {"resumen": "titulo", "bloques": [{"autor": "nombre", "tema": "titulo", "contenido": "HTML"}]}`;

        try {
            // Intento 1 con nombre estándar
            let response = await callGemini(key, prompt, 'gemini-1.5-flash');
            let data = await response.json();

            // Si falla el modelo, intento 2 con nombre extendido
            if (data.error && data.error.message.includes("not found")) {
                response = await callGemini(key, prompt, 'gemini-1.5-flash-latest');
                data = await response.json();
            }

            if (data.error) throw new Error(data.error.message);

            const rawText = data.candidates[0].content.parts[0].text;
            const plan = JSON.parse(rawText);
            
            renderPlan(plan);
        } catch (e) {
            errorDisplay.innerText = "Error: " + e.message;
            errorDisplay.style.display = 'block';
        } finally {
            loader.style.display = 'none';
        }
    }

    function renderPlan(plan) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('pdfBtn').style.display = 'block';
        document.getElementById('resumenTitulo').innerText = plan.resumen;
        const container = document.getElementById('sectionsContainer');
        container.innerHTML = plan.bloques.map(b => `
            <div class="section-item">
                <small style="color: #666; font-weight: bold;">${b.autor}</small>
                <h3 style="margin: 5px 0;">${b.tema}</h3>
                <div>${b.contenido}</div>
            </div>
        `).join('');
        document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    function downloadPDF() {
        const element = document.getElementById('pdfContent');
        html2pdf().from(element).save('Estrategia-Agencia.pdf');
    }
</script>
</body>
</html>

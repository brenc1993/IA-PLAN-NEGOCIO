<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Agency OS — Business Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --bg2: #121212; --bg3: #1a1a1a;
            --accent: #e8c97a; --text: #f0ede8; --text2: #a09c97;
            --border: rgba(255,255,255,0.06); --radius: 12px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 2.5rem; color: var(--accent); margin-bottom: 5px; }
        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; margin-bottom: 20px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
        input, textarea, select { 
            width: 100%; background: var(--bg3); border: 1px solid var(--border); padding: 12px; 
            border-radius: 8px; color: white; margin-bottom: 15px; font-family: inherit; box-sizing: border-box;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stage-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .stage-btn { 
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); 
            background: var(--bg3); color: var(--text2); cursor: pointer; font-size: 13px;
        }
        .stage-btn.active { background: var(--accent); color: black; font-weight: 700; border-color: var(--accent); }
        .btn-main { 
            width: 100%; background: var(--accent); color: black; border: none; padding: 18px; 
            font-size: 16px; font-family: 'Syne', sans-serif; font-weight: 700; border-radius: var(--radius); 
            cursor: pointer; transition: 0.2s;
        }
        .btn-pdf { 
            background: transparent; border: 1px solid var(--accent); color: var(--accent); 
            padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 20px; display: none;
        }
        #result { display: none; margin-top: 40px; padding: 30px; background: white; color: #111; border-radius: 8px; }
        .section-card { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .author-tag { font-weight: 700; color: #666; text-transform: uppercase; font-size: 12px; }
        .loader { display: none; text-align: center; color: var(--accent); margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Agency OS<span>.</span></h1>
    <p style="color: var(--text2); margin-bottom: 30px;">Generador de Estrategia de Negocio con Inteligencia Artificial.</p>

    <div class="card">
        <label>Google API Key</label>
        <input type="password" id="apiKey" placeholder="Pegá tu llave de Gemini aquí...">

        <label>Descripción del Proyecto</label>
        <textarea id="desc" rows="6" placeholder="Ej: Quiero transicionar de ser Community Manager a tener mi propia agencia..."></textarea>

        <label>Etapa Actual</label>
        <div class="stage-group" id="stageGroup">
            <button class="stage-btn active" onclick="setStage(this, 'idea')">Idea</button>
            <button class="stage-btn" onclick="setStage(this, 'validado')">Validado</button>
            <button class="stage-btn" onclick="setStage(this, 'primeros clientes')">Primeros Clientes</button>
            <button class="stage-btn" onclick="setStage(this, 'creciendo')">Creciendo</button>
            <button class="stage-btn" onclick="setStage(this, 'escalar')">Escalar</button>
        </div>

        <div class="grid">
            <div>
                <label>Objetivo</label>
                <select id="goal">
                    <option value="validar idea">Validar idea</option>
                    <option value="conseguir primeros clientes">Conseguir clientes</option>
                    <option value="definir precios">Definir precios/monetizar</option>
                    <option value="escalar">Escalar facturación</option>
                    <option value="diferenciarse">Diferenciarse</option>
                    <option value="marca">Construir marca sólida</option>
                </select>
            </div>
            <div>
                <label>Inversión mensual</label>
                <select id="budget">
                    <option value="orgánico">$0 (Orgánico)</option>
                    <option value="bajo">< 500 USD</option>
                    <option value="medio">500 - 2000 USD</option>
                    <option value="alto">> 2000 USD</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <input type="text" id="competition" placeholder="Competencia (opcional)">
            <input type="text" id="obstacle" placeholder="Mayor obstáculo (opcional)">
        </div>
    </div>

    <button class="btn-main" id="genBtn" onclick="generatePlan()">GENERAR ESTRATEGIA →</button>
    
    <div class="loader" id="loader">Gemini está procesando los frameworks...</div>

    <button class="btn-pdf" id="pdfBtn" onclick="downloadPDF()">↓ DESCARGAR COMO PDF</button>

    <div id="result">
        <div id="pdfContent">
            <h1 id="resumenTitulo" style="color: #000; border-bottom: 2px solid #000; padding-bottom: 10px;"></h1>
            <div id="sectionsContainer"></div>
        </div>
    </div>
</div>

<script>
    let currentStage = 'idea';

    function setStage(btn, val) {
        document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStage = val;
    }

    async function generatePlan() {
        const key = document.getElementById('apiKey').value.trim();
        const desc = document.getElementById('desc').value.trim();
        if (!key || !desc) { alert("Completá la API Key y la descripción."); return; }

        document.getElementById('loader').style.display = 'block';
        document.getElementById('genBtn').disabled = true;

        const prompt = `Actúa como un experto en negocios. Analiza: ${desc}. Etapa: ${currentStage}, Objetivo: ${document.getElementById('goal').value}.
        Genera un plan con frameworks de Hormozi, Sinek, Drucker y Godin.
        IMPORTANTE: Responde ÚNICAMENTE en formato JSON puro, sin decoraciones, sin markdown.
        Estructura: {"resumen": "frase", "bloques": [{"autor": "nombre", "tema": "título", "contenido": "HTML"}]}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { response_mime_type: "application/json" }
                })
            });

            const data = await response.json();
            // Limpieza de seguridad por si acaso
            let textResponse = data.candidates[0].content.parts[0].text;
            const plan = JSON.parse(textResponse);
            
            renderOutput(plan);
        } catch (e) {
            console.error(e);
            alert("Error al procesar: " + e.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('genBtn').disabled = false;
        }
    }

    function renderOutput(plan) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('pdfBtn').style.display = 'block';
        document.getElementById('resumenTitulo').innerText = plan.resumen;
        const container = document.getElementById('sectionsContainer');
        container.innerHTML = '';

        plan.bloques.forEach(b => {
            const div = document.createElement('div');
            div.className = 'section-card';
            div.innerHTML = `<span class="author-tag">${b.autor} | ${b.tema}</span><div style="margin-top:10px">${b.contenido}</div>`;
            container.appendChild(div);
        });
        document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    function downloadPDF() {
        const element = document.getElementById('pdfContent');
        const opt = {
            margin: 1,
            filename: 'Estrategia-Agencia.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
